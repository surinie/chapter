<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
<title>dance</title>
<style>
  *{margin:0;box-sizing:border-box}
  body{background:#fff}
  a{display:block;text-decoration:none}
  a img{display:block;width:100%;height:auto}
  a.label{white-space:nowrap;font-family:"Source Serif 4",serif;color:#FF3511;font-size:24px}
  .debug a{outline:1px solid red}
</style>
</head>
<body>
<script>
const SCREEN_W = 1728, MARGIN = 120;
const BASE_Y = 800, LABEL_Y = 860;
const POSITION = 'fixed';   // 'fixed' = 화면에 고정 / 'absolute' = 페이지와 함께 스크롤
const DEBUG = false;        // true면 클릭 영역이 빨간 테두리로 보임

const CHAPTERS = [
  { img:'1.png', href:'2.html', w:350, dx:50, dy:-30, ldx:-20, label:'❶ ballet class' },
  { img:'2.png', href:'2.html', w:480, dx:0, dy:100,  ldx:-20, label:'❷ street' },
  { img:'3.png', href:'2.html', w:380, dx:0, dy:-10,   ldx:-20, label:'❸ christmas' },
  { img:'4.png', href:'2.html', w:410, dx:-20, dy:17,  ldx:-20, label:'❹ audition' },
  { img:'5.png', href:'2.html', w:421, dx:0, dy:31,  ldx:-20, label:'❺ finale' },
];
/* ─────────────────────────────────────────────────────── */

if (DEBUG) document.body.classList.add('debug');
const colW = (SCREEN_W - MARGIN * 2) / CHAPTERS.length;

CHAPTERS.forEach((c, i) => {
  const cx = MARGIN + colW * (i + 0.5);          // 칸의 가운데 x

  const a = document.createElement('a');
  a.href = c.href;
  a.style.cssText = `position:${POSITION};left:${cx + c.dx}px;top:${BASE_Y + c.dy}px;width:${c.w}px;transform:translate(-50%,-100%)`;
  a.innerHTML = `<img src="${c.img}" alt="${c.label}">`;
  document.body.appendChild(a);

  const l = document.createElement('a');
  l.href = c.href;
  l.className = 'label';
  l.textContent = c.label;
  l.style.cssText = `position:${POSITION};left:${cx + c.ldx}px;top:${LABEL_Y}px;transform:translateX(-50%)`;
  document.body.appendChild(l);
});
</script>
</body>
</html>
